<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Will's Photography</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #303033;
      --ink: #f2f0ec;
      --muted: rgba(242, 240, 236, 0.55);
    }

    html, body, #dragger, #ring, .img, .vignette {
      width: 100%;
      height: 100%;
      transform-style: preserve-3d;
      user-select: none;
    }

    html, body {
      margin: 0;
      overflow: hidden;
      background: #303033;
      color: var(--ink);
      font-family: 'Inter', system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    div {
      position: absolute;
    }

    /* ---------- Title ---------- */
    header {
      position: fixed;
      top: clamp(48px, 11vh, 120px);
      left: 0;
      right: 0;
      text-align: center;
      pointer-events: none;
      z-index: 3;
    }

    header h1 {
      margin: 0;
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-weight: 300;
      font-size: clamp(34px, 6vw, 64px);
      letter-spacing: 0.28em;
      text-indent: 0.28em;
      text-transform: uppercase;
      opacity: 0;
      animation: rise 1.4s 0.5s cubic-bezier(.2,.8,.2,1) forwards;
    }

    header .rule {
      width: 48px;
      height: 1px;
      margin: 20px auto 0;
      background: var(--muted);
      transform: scaleX(0);
      animation: grow 1.2s 1s cubic-bezier(.2,.8,.2,1) forwards;
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes grow {
      to { transform: scaleX(1); }
    }

    /* ---------- Carousel (unchanged from original) ---------- */
    .container {
      perspective: 2000px;
      width: 300px;   /* overwritten by the script to match your image shape */
      height: 300px;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
    }

    .vignette {
      width: 1400px;
      left: 50%;
      transform: translateX(-50%);
      background: linear-gradient(to left, #303033 12%, rgba(0,0,0,0) 40%, rgba(0,0,0,0) 60%, #303033 88%);
      pointer-events: none;
    }

    /* ---------- Buttons ---------- */
    nav {
      position: fixed;
      bottom: clamp(60px, 13vh, 140px);
      left: 50%;
      transform: translateX(-50%);
      width: min(1100px, calc(100% - 40px));
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 18px 28px;
      z-index: 5;           /* sits above the drag surface */
    }

    .btn {
      position: relative;
      overflow: hidden;
      isolation: isolate;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0;
      padding: 14px 20px;
      font: 400 15px/1 'Inter', system-ui, sans-serif;
      letter-spacing: 0.02em;
      color: #303033;
      text-decoration: none;
      background: #fff;
      border: 1px solid #fff;
      border-radius: 4px;
      cursor: pointer;
      opacity: 0;
      animation: rise 1s cubic-bezier(.2,.8,.2,1) forwards;
      transition: transform 0.35s cubic-bezier(.2,.8,.2,1),
                  box-shadow 0.35s ease,
                  border-color 0.35s ease,
                  color 0.35s ease,
                  gap 0.35s cubic-bezier(.2,.8,.2,1);
    }

    /* fill that sweeps in from the left */
    .btn::before {
      content: '';
      position: absolute;
      inset: 0;
      background: #303033;
      transform: translateX(-101%);
      transition: transform 0.45s cubic-bezier(.7,0,.2,1);
      z-index: -1;
    }

    /* arrow that slides in on hover */
    .btn::after {
      content: '→';
      width: 0;
      opacity: 0;
      overflow: hidden;
      letter-spacing: 0;
      transform: translateX(-8px);
      transition: width 0.35s cubic-bezier(.2,.8,.2,1),
                  opacity 0.35s ease,
                  transform 0.35s cubic-bezier(.2,.8,.2,1);
    }

    .btn:nth-child(1) { animation-delay: 1.3s; }
    .btn:nth-child(2) { animation-delay: 1.4s; }
    .btn:nth-child(3) { animation-delay: 1.5s; }
    .btn:nth-child(4) { animation-delay: 1.6s; }
    .btn:nth-child(5) { animation-delay: 1.7s; }
    .btn:nth-child(6) { animation-delay: 1.8s; }

    .btn:hover,
    .btn:focus-visible {
      color: #fff;
      border-color: #fff;
      gap: 10px;
      transform: translateY(-4px);
      box-shadow: 0 12px 24px rgba(0, 0, 0, 0.4);
      outline: none;
    }
    .btn:hover::before,
    .btn:focus-visible::before { transform: translateX(0); }
    .btn:hover::after,
    .btn:focus-visible::after {
      width: 14px;
      opacity: 1;
      transform: translateX(0);
    }

    .btn:active { transform: translateY(-1px) scale(0.97); }

    @media (max-width: 640px) {
      nav { grid-template-columns: repeat(2, 1fr); gap: 12px; }
      .btn { padding: 12px 10px; font-size: 13px; }
    }

    /* ---------- Drag surface ---------- */
    #dragger { cursor: grab; }
  </style>
</head>
<body>
  <header>
    <h1>Will's Photography</h1>
    <div class="rule"></div>
  </header>

  <div class="container" id="container">
    <div id="ring"></div>
  </div>
  <div class="vignette"></div>
  <div id="dragger"></div>

  <nav>
    <a class="btn" data-path="day-in-the-life">Day in the life</a>
    <a class="btn" data-path="camera-repair-shop">Camera Repair Shop</a>
    <a class="btn" data-path="secret-mission">Secret Mission</a>
    <a class="btn" data-path="lightroom-challenges">Lightroom Challenges</a>
    <a class="btn" data-path="elements-of-photography">Elements of Photography</a>
    <a class="btn" data-path="famous-photographer">Famous Photographer</a>
  </nav>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/Draggable.min.js"></script>
  <script>
    gsap.registerPlugin(Draggable);

    // ---- BUTTON LINKS ----
    // Each button's data-path is added onto the end of BASE_URL.
    // Example: BASE_URL + "camera-repair-shop"
    //   -> https://sites.google.com/view/wills-photography/camera-repair-shop
    const BASE_URL = 'https://sites.google.com/view/YOUR-SITE-NAME/';   // <-- change this (keep the trailing slash)
    // '_top'   = opens in the whole Google Site page (leaves the embed)
    // '_blank' = opens in a new tab
    const LINK_TARGET = '_top';

    document.querySelectorAll('.btn').forEach((a) => {
      a.href = BASE_URL + a.dataset.path;
      a.target = LINK_TARGET;
      if (LINK_TARGET === '_blank') a.rel = 'noopener';
    });

    // YOUR IMAGES (keep them in the same folder as this file)
    const images = [
      'Cam1.jpg',
      'Ducks1.jpg',
      'Ducks2.jpg',
      'Ducks3.jpg',
      'Ducks4.jpg',
      'Ducks5.jpg',
      'UpStairs.jpg'
    ];

    // ---- Size settings ----
    const IMG_RATIO = 1280 / 873;   // your photos' width / height
    const PANEL_H   = 300;          // height of each panel in px (change to make the ring bigger or smaller)
    const PARALLAX  = 120;          // how far each photo slides sideways as it rotates (px)
    const GAP       = 1.02;         // 1 = panels touch, higher = small gaps between them

    const count   = images.length;
    const angle   = 360 / count;
    const PANEL_W = Math.round(PANEL_H * IMG_RATIO);
    const RADIUS  = Math.round(PANEL_W / (2 * Math.sin(Math.PI / count)) * GAP);

    const container = document.getElementById('container');
    const ring = document.getElementById('ring');
    const dragger = document.getElementById('dragger');

    container.style.width  = PANEL_W + 'px';
    container.style.height = PANEL_H + 'px';

    images.forEach(() => {
      const div = document.createElement('div');
      div.className = 'img';
      ring.appendChild(div);
    });

    let xPos = 0;

    gsap.timeline()
      .set(dragger, { opacity: 0 })
      .set(ring, { rotationY: 180 })
      .set('.img', {
        rotateY: (i) => i * -angle,
        transformOrigin: '50% 50% ' + RADIUS + 'px',
        z: -RADIUS,
        backgroundImage: (i) => 'url(' + images[i] + ')',
        backgroundRepeat: 'no-repeat',
        backgroundSize: (PANEL_W + PARALLAX) + 'px auto',
        backgroundPosition: (i) => getBgPos(i),
        backfaceVisibility: 'hidden'
      })
      .from('.img', {
        duration: 1.5,
        y: 200,
        opacity: 0,
        stagger: 0.1,
        ease: 'expo'
      });

    Draggable.create(dragger, {
      onDragStart: (e) => {
        if (e.touches) e.clientX = e.touches[0].clientX;
        xPos = Math.round(e.clientX);
      },
      onDrag: (e) => {
        if (e.touches) e.clientX = e.touches[0].clientX;
        gsap.to(ring, {
          rotationY: '-=' + ((Math.round(e.clientX) - xPos) % 360),
          onUpdate: () => {
            gsap.set('.img', { backgroundPosition: (i) => getBgPos(i) });
          }
        });
        xPos = Math.round(e.clientX);
      },
      onDragEnd: () => {
        gsap.set(dragger, { x: 0, y: 0 });
      }
    });

    function getBgPos(i) {
      const x = -gsap.utils.wrap(0, 360, gsap.getProperty(ring, 'rotationY') - 180 - i * angle) / 360 * PARALLAX;
      return x + 'px 50%';
    }
  </script>
</body>
</html>
